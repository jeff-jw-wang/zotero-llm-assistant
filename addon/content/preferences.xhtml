<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>

<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>

  <!-- ── Provider selection ─────────────────────────────────────────── -->
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-provider"
      data-l10n-id="pref-provider-label"
      style="min-width: 100px;"
    ></html:label>
    <menulist id="zotero-prefpane-__addonRef__-provider" style="flex: 1;">
      <menupopup>
        <menuitem label="Ollama (local)" value="ollama" />
        <menuitem label="Google Gemini" value="gemini" />
        <menuitem label="OpenAI (GPT-4o-mini)" value="openai" />
        <menuitem label="Anthropic (Claude)" value="anthropic" />
        <menuitem label="Custom Endpoint" value="custom" />
      </menupopup>
    </menulist>
  </hbox>

  <!-- ── Ollama section ─────────────────────────────────────────────── -->
  <vbox id="zotero-prefpane-__addonRef__-section-ollama" style="margin-top: 6px;">
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-ollama-endpoint"
        data-l10n-id="pref-endpoint-label"
        style="min-width: 100px;"
      ></html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-ollama-endpoint"
        placeholder="http://localhost:11434"
        style="flex: 1;"
      />
    </hbox>
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-ollama-model"
        data-l10n-id="pref-model-label"
        style="min-width: 100px;"
      ></html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-ollama-model"
        placeholder="llama3.2"
        style="flex: 1;"
      />
    </hbox>
    <description style="color: #666; font-size: 11px;" data-l10n-id="pref-ollama-hint" />
    <hbox align="center" style="margin-top: 4px; gap: 8px;">
      <html:span
        id="zotero-prefpane-__addonRef__-ollama-status"
        style="font-size: 11px; color: #666; flex: 1;"
      ></html:span>
      <button
        id="zotero-prefpane-__addonRef__-ollama-check-btn"
        data-l10n-id="pref-ollama-check"
        style="font-size: 11px;"
      />
      <button
        id="zotero-prefpane-__addonRef__-ollama-install-btn"
        data-l10n-id="pref-ollama-install"
        style="font-size: 11px;"
      />
    </hbox>
  </vbox>

  <!-- ── Gemini section ─────────────────────────────────────────────── -->
  <vbox id="zotero-prefpane-__addonRef__-section-gemini" hidden="true" style="margin-top: 6px;">
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-gemini-apikey"
        data-l10n-id="pref-api-key-label"
        style="min-width: 100px;"
      ></html:label>
      <html:input
        type="password"
        id="zotero-prefpane-__addonRef__-gemini-apikey"
        style="flex: 1;"
      />
    </hbox>
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-gemini-model"
        data-l10n-id="pref-model-label"
        style="min-width: 100px;"
      ></html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-gemini-model"
        placeholder="gemini-2.0-flash"
        style="flex: 1;"
      />
    </hbox>
    <description style="color: #666; font-size: 11px;" data-l10n-id="pref-gemini-hint" />
  </vbox>

  <!-- ── OpenAI section ────────────────────────────────────────────── -->
  <vbox id="zotero-prefpane-__addonRef__-section-openai" hidden="true" style="margin-top: 6px;">
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-openai-apikey"
        data-l10n-id="pref-api-key-label"
        style="min-width: 100px;"
      ></html:label>
      <html:input
        type="password"
        id="zotero-prefpane-__addonRef__-openai-apikey"
        style="flex: 1;"
      />
    </hbox>
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-openai-model"
        data-l10n-id="pref-model-label"
        style="min-width: 100px;"
      ></html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-openai-model"
        placeholder="gpt-4o-mini"
        style="flex: 1;"
      />
    </hbox>
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-openai-endpoint"
        data-l10n-id="pref-endpoint-label"
        style="min-width: 100px;"
      ></html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-openai-endpoint"
        placeholder="https://api.openai.com"
        style="flex: 1;"
      />
    </hbox>
    <html:span
      id="zotero-prefpane-__addonRef__-openai-endpoint-error"
      style="color: #c00; font-size: 11px; min-height: 14px; display: block;"
    ></html:span>
    <description style="color: #666; font-size: 11px;" data-l10n-id="pref-openai-hint" />
  </vbox>

  <!-- ── Anthropic section ─────────────────────────────────────────── -->
  <vbox id="zotero-prefpane-__addonRef__-section-anthropic" hidden="true" style="margin-top: 6px;">
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-anthropic-apikey"
        data-l10n-id="pref-api-key-label"
        style="min-width: 100px;"
      ></html:label>
      <html:input
        type="password"
        id="zotero-prefpane-__addonRef__-anthropic-apikey"
        style="flex: 1;"
      />
    </hbox>
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-anthropic-model"
        data-l10n-id="pref-model-label"
        style="min-width: 100px;"
      ></html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-anthropic-model"
        placeholder="claude-sonnet-4-6"
        style="flex: 1;"
      />
    </hbox>
    <description style="color: #666; font-size: 11px;" data-l10n-id="pref-anthropic-hint" />
  </vbox>

  <!-- ── Custom endpoint section ───────────────────────────────────── -->
  <vbox id="zotero-prefpane-__addonRef__-section-custom" hidden="true" style="margin-top: 6px;">
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-custom-endpoint"
        data-l10n-id="pref-endpoint-label"
        style="min-width: 100px;"
      ></html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-custom-endpoint"
        placeholder="https://your-server.example.com"
        style="flex: 1;"
      />
    </hbox>
    <html:span
      id="zotero-prefpane-__addonRef__-custom-endpoint-error"
      style="color: #c00; font-size: 11px; min-height: 14px; display: block;"
    ></html:span>
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-custom-apikey"
        data-l10n-id="pref-api-key-label"
        style="min-width: 100px;"
      ></html:label>
      <html:input
        type="password"
        id="zotero-prefpane-__addonRef__-custom-apikey"
        style="flex: 1;"
      />
    </hbox>
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-custom-model"
        data-l10n-id="pref-model-label"
        style="min-width: 100px;"
      ></html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-custom-model"
        placeholder="model-name"
        style="flex: 1;"
      />
    </hbox>
    <description style="color: #b45309; font-size: 11px;" data-l10n-id="pref-custom-warning" />
  </vbox>

  <!-- ── API key security note ──────────────────────────────────────── -->
  <description
    data-l10n-id="pref-api-key-warning"
    style="color: #888; font-size: 11px; margin-top: 8px;"
  />

  <!-- ── Semantic Search ─────────────────────────────────────────────── -->
  <separator />
  <label><html:h3 data-l10n-id="pref-semantic-label"></html:h3></label>
  <checkbox
    id="zotero-prefpane-__addonRef__-semantic-enabled"
    data-l10n-id="pref-semantic-toggle"
  />
  <description
    data-l10n-id="pref-semantic-note"
    style="color: #666; font-size: 11px; margin-left: 22px;"
  />
  <hbox align="center" style="margin-top: 4px; margin-left: 22px; gap: 8px;">
    <html:span
      id="zotero-prefpane-__addonRef__-semantic-status"
      style="font-size: 11px; color: #666;"
    ></html:span>
    <button
      id="zotero-prefpane-__addonRef__-semantic-download-btn"
      label="Download Model"
      hidden="true"
      style="font-size: 11px;"
    />
  </hbox>

  <!-- ── Privacy ────────────────────────────────────────────────────── -->
  <separator />
  <label><html:h3 data-l10n-id="pref-privacy-label"></html:h3></label>
  <checkbox
    id="zotero-prefpane-__addonRef__-cloud-sharing"
    data-l10n-id="pref-cloud-sharing"
  />
  <description
    data-l10n-id="pref-cloud-sharing-note"
    style="color: #666; font-size: 11px; margin-left: 22px;"
  />
</groupbox>

<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
